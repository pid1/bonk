[project]
name = "bonk"
version = "1.0.0"
description = "Turning your PC into a 2004 DVD player on standby"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pygame-ce>=2.5.3",
]

[project.scripts]
bonk = "bonk.__main__:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bonk"]

# black and ruff format both run in CI. ruff reads line-length from
# [tool.ruff]; black does not, and would otherwise wrap at its default 88,
# so the two disagree on every line between 88 and 100 characters.
[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
