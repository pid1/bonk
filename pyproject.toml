[project]
name = "bonk"
version = "1.0.0"
description = "Turning your PC into a 2004 DVD player on standby"
requires-python = ">=3.15"
license = { text = "MIT" }
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.scripts]
bonk = "bonk.__main__:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "ruff>=0.17.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# sadr: install only releases that have been public for 7 days
exclude-newer = "7 days"

[tool.hatch.build.targets.wheel]
packages = ["src/bonk"]

# black and ruff format both run in CI. ruff reads line-length from
# [tool.ruff]; black does not, and would otherwise wrap at its default 88,
# so the two disagree on every line between 88 and 100 characters.
[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
